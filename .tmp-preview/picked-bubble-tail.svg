<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
  <title id="title">How the picked-card talk bubble is drawn</title>
  <desc id="desc">A swiper row of picked cast cards sits above the details panel. A small square rotated 45 degrees, carrying only two borders and the panel fill, has its centre pinned to the panel top edge under the selected card, so its fill hides the border segment behind it and the outline reads as a speech bubble. Selecting another card moves that square along the edge with a transform transition.</desc>

  <defs>
    <marker id="glide" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f0b64a"/>
    </marker>
  </defs>

  <rect width="1200" height="675" rx="12" fill="#0e1820"/>

  <text x="56" y="66" font-size="34" font-weight="700" fill="#e8eef3">Talk-bubble pointer on the details panel</text>
  <text x="56" y="102" font-size="20" fill="#93a7b5">The picked cards swipe above the panel; the tail sits under the selected card.</text>

  <text x="56" y="140" font-size="18" fill="#93a7b5">picked cards &#183; swiper row</text>

  <g stroke-width="3">
    <text x="158" y="162" font-size="18" fill="#93a7b5" text-anchor="middle">1</text>
    <text x="272" y="162" font-size="18" fill="#93a7b5" text-anchor="middle">2</text>
    <text x="386" y="162" font-size="18" fill="#93a7b5" text-anchor="middle">3</text>
    <text x="500" y="162" font-size="18" fill="#93a7b5" text-anchor="middle">4</text>

    <rect x="110" y="170" width="96" height="130" rx="12" fill="#241f45" stroke="#dcffeb"/>
    <rect x="224" y="170" width="96" height="130" rx="12" fill="#241f45" stroke="#6b5aa0"/>
    <rect x="338" y="170" width="96" height="130" rx="12" fill="#241f45" stroke="#6b5aa0"/>
    <rect x="452" y="170" width="96" height="130" rx="12" fill="#241f45" stroke="#6b5aa0"/>

    <rect x="110" y="336" width="454" height="140" rx="12" fill="#1c193c" stroke="#6b5aa0"/>

    <rect x="134" y="358" width="64" height="96" rx="12" fill="#16202a" stroke="#33465a"/>
    <rect x="214" y="358" width="132" height="96" rx="12" fill="#16202a" stroke="#33465a"/>
    <rect x="362" y="358" width="178" height="96" rx="12" fill="#16202a" stroke="#33465a"/>

    <rect x="148" y="326" width="20" height="20" transform="rotate(45 158 336)" fill="#1c193c" stroke="none"/>
    <path d="M 144 336 L 158 322 L 172 336" fill="none" stroke="#6b5aa0" stroke-linejoin="round"/>

    <path d="M 372 336 L 386 322 L 400 336" fill="none" stroke="#f0b64a" stroke-dasharray="7 6"/>
    <path d="M 180 309 H 352" fill="none" stroke="#f0b64a" marker-end="url(#glide)"/>
  </g>

  <text x="166" y="412" font-size="16" fill="#93a7b5" text-anchor="middle">count</text>
  <text x="280" y="412" font-size="16" fill="#93a7b5" text-anchor="middle">hp dials</text>
  <text x="451" y="412" font-size="16" fill="#93a7b5" text-anchor="middle">notes</text>

  <text x="360" y="314" font-size="17" fill="#f0b64a">glides on selection</text>

  <rect x="640" y="170" width="504" height="330" rx="12" fill="#131f29" stroke="#33465a" stroke-width="3"/>

  <text x="672" y="210" font-size="22" font-weight="700" fill="#e8eef3">tail anatomy, magnified</text>

  <g stroke-width="3">
    <path d="M 672 330 H 762" fill="none" stroke="#6b5aa0"/>
    <path d="M 1022 330 H 1112" fill="none" stroke="#6b5aa0"/>
    <path d="M 762 330 H 1022" fill="none" stroke="#f0b64a" stroke-dasharray="7 6"/>
    <rect x="832" y="270" width="120" height="120" transform="rotate(45 892 330)" fill="#1c193c" stroke="none"/>
    <path d="M 807 330 L 892 245 L 977 330" fill="none" stroke="#f0b64a" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <circle cx="892" cy="330" r="5" fill="#f0b64a"/>
  <path d="M 896 326 L 1000 286" fill="none" stroke="#93a7b5" stroke-width="2"/>
  <text x="1006" y="282" font-size="16" fill="#93a7b5">centre on the edge</text>
  <path d="M 786 245 H 794 M 786 330 H 794 M 790 245 V 330" fill="none" stroke="#93a7b5" stroke-width="2"/>
  <text x="778" y="292" font-size="16" fill="#93a7b5" text-anchor="end">tip 9.9 px</text>
  <text x="1128" y="366" font-size="16" fill="#f0b64a" text-anchor="end">hidden behind the fill</text>
  <text x="892" y="452" font-size="17" fill="#93a7b5" text-anchor="middle">14 &#215; 14 square, rotate(45&#176;)</text>

  <text x="56" y="524" font-size="20" font-weight="700" fill="#e8eef3">How it works</text>
  <g font-family="monospace" font-size="18" fill="#cfe0ea">
    <text x="56" y="556">&#8226; measure: x = slide centre &#8722; panel left, clamped to [18, panel width &#8722; 18]</text>
    <text x="56" y="582">&#8226; the panel carries --picker-tail-x, bound to that measurement in px</text>
    <text x="56" y="608">&#8226; transform: translateX(calc(var(--picker-tail-x) &#8722; 7px)) rotate(45deg)</text>
    <text x="56" y="634">&#8226; transition: transform 240 ms cubic-bezier(0.22, 1, 0.36, 1)</text>
    <text x="56" y="660">&#8226; first placement skips it; Swiper setTranslate + ResizeObserver re-measure</text>
  </g>
</svg>
