<!--
  The sublocation form, the library's own fields brought over to the v2 campaign components
  the rest of the drawer uses: the free-text fields (name, description, GM notes) are
  `cc-textbox` in campaign context, the hashtags are `cc-keyword-tags` and the shop inventory
  is `cc-shop-inventory`. Those components draw their own labels, inputs and notes, so the form
  itself carries only the layout markup the faction form carries.
-->
<div class="pic-new-form-wrap">
  <form [formGroup]="sublocationForm" class="pic-new-form pic-new-form--wrap">

    <div class="wr form-row-gap">
      <div class="form-field">
        <app-cc-textbox
          label="Sublocation Name"
          context="campaign"
          formControlName="name"
        />
      </div>
    </div>

    <app-cc-textbox
      label="Description"
      type="textarea"
      [rows]="3"
      context="campaign"
      formControlName="description"
    />

    <fieldset class="form-gm-box">
      <legend class="form-gm-box__legend">FOR GM EYES ONLY</legend>

      <div class="form-row-gap">
        <div class="form-field">
          <cc-keyword-tags
            label="Hashtags / Keywords"
            placeholder="Add or select hashtags…"
            context="campaign"
            [options]="keywordOptions()"
            formControlName="keywords"
          />
        </div>

        <div class="form-field">
          <app-cc-textbox
            label="GM Notes"
            type="textarea"
            [rows]="3"
            context="campaign"
            formControlName="dmNotes"
          />
        </div>
      </div>

    </fieldset>

    <!--
      Last in the form: the sublocation's shop, drawn by the shell's own inventory component
      (`cc-shop-inventory`), which carries its own heading, the "Add Item" button and the coin
      buttons, and hands back the items it can read in full. It is the library form's own
      "Shop Inventory" section, standing where that form stands it — after the GM box.
    -->
    <cc-shop-inventory
      label="Shop Inventory"
      context="campaign"
      formControlName="shopItems"
    />

    <div class="pic-save-row">
      <button class="campaign-primary-btn" type="button"
              [disabled]="sublocationForm.invalid || saveStatus() === 'saving'"
              (click)="onSave()">@if (saveStatus() === 'saving') { Saving… } @else { Save }</button>
    </div>

  </form>
</div>
