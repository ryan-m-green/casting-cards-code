@if (worldMapImageUrl(); as url) {
  <!--
    `--wm-aspect` tells the frame the picture's own proportions, so the frame is measured by
    the image and the 12px gutter around it stays 12px on every side (see .world-map--fitted).
    Until the picture has loaded the frame fills the area, which is where the image is still
    letterboxed - nothing is ever clipped on the way in.
  -->
  <div
    class="world-map"
    [class.world-map--fitted]="imageAspectRatio() !== null"
    [style.--wm-aspect]="imageAspectRatio()"
    [style.--portal-color]="portalColor()"
  >
    <img
      class="world-map__image"
      [src]="url"
      alt="World map"
      (load)="onImageLoaded($event)"
      (error)="onImageSettled()"
    />
    <app-cc-view-btn label="View world map" (clicked)="requestView.emit()" />
    @if (isDm()) {
      <!--
        The way to another map: the campaign's shared edit control (see cc-edit-button), dressed in the
        campaign's own colour, in the same 44px square the view button beside it wears — one to look at
        the map, one to change it.

        The control is a button rather than the label the picker used to hang off: the file input is
        kept beside it, unseen and out of the tab's way, and the control opens it (see
        `openReplacePicker`). While the file is going up the control is held, so the picker cannot be
        asked twice.
      -->
      <input
        #replaceMapFile
        type="file"
        accept="image/jpeg,image/png,image/webp"
        class="world-map__input"
        tabindex="-1"
        aria-hidden="true"
        [disabled]="uploading()"
        (change)="onFileSelected($event)"
      />
      <cc-edit-button
        label="Replace world map"
        [disabled]="uploading()"
        (clicked)="openReplacePicker(replaceMapFile)"
      />
    }
  </div>
} @else {
  <div class="world-map world-map--empty" [style.--portal-color]="portalColor()">
    @if (isDm()) {
      <label class="world-map__upload">
        <input
          type="file"
          accept="image/jpeg,image/png,image/webp"
          class="world-map__input"
          (change)="onFileSelected($event)"
        />
        <span class="world-map__upload-btn">
          {{ uploading() ? 'Uploading…' : 'Upload world map' }}
        </span>
      </label>
      @if (error()) {
        <p class="world-map__error">{{ error() }}</p>
      }
    } @else {
      <p class="world-map__placeholder">No world map yet</p>
    }
  </div>
}
