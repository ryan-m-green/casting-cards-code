<!--
  The light over a freshly revealed card: the fairy standing at its source, the beam (a clipped
  cone) falling from her, and the pool where it lands — the one thing you can click, which puts the
  light away.

  A card that only leads down to a reveal shows the fairy alone, with no beam and no pool: there is
  nothing here to have seen, so there is nothing to click away (see the component's own note).
-->
@if (showing()) {
  @if (beam()) {
    <span class="spotlight-beam" aria-hidden="true"></span>
  }
  <img
    class="spotlight-source"
    [class.spotlight-source--pointing]="pointing()"
    src="/fairy_pointed_ears.svg"
    alt=""
    aria-hidden="true"
  />
  @if (beam()) {
    <button
      type="button"
      class="spotlight-pool"
      aria-label="Dismiss the reveal spotlight"
      title="Dismiss"
      (click)="onDismiss()"
    ></button>
  }
}
