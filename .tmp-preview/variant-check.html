<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>rim break variants</title>
<style>
  body { margin: 0; padding: 14px 16px; background: rgb(14, 24, 32); font-family: system-ui, sans-serif; }
  .grid { display: grid; grid-template-columns: 40px 260px 100px 200px; align-items: center; gap: 10px 16px; }
  .lab { color: #c8e1eb; font: 11px/1.4 monospace; letter-spacing: .1em; }
  .head { color: #7f9aa8; font: 10px/1.4 monospace; }
  .zw { width: 260px; height: 260px; overflow: hidden; }
  .z { width: 24px; height: 24px; display: block; transform: scale(10); transform-origin: 0 0;
       image-rendering: pixelated; filter: brightness(0) invert(1); }
  .m { display: block; object-fit: contain; filter: brightness(0) invert(1); }
</style>
</head>
<body>

<div class="grid">
  <div class="head">&nbsp;</div>
  <div class="head">24px raster @ 10x</div>
  <div class="head">96px</div>
  <div class="head">192px</div>

  <div class="lab">v1<br />30&deg;</div>
  <div class="zw"><img class="z" src="compass-cracked-motivation.svg" alt="" /></div>
  <img class="m" style="width:96px;height:96px" src="compass-cracked-motivation.svg" alt="" />
  <img class="m" style="width:192px;height:192px" src="compass-cracked-motivation.svg" alt="" />

  <div class="lab">v2<br />24&deg;</div>
  <div class="zw"><img class="z" src="v2.svg" alt="" /></div>
  <img class="m" style="width:96px;height:96px" src="v2.svg" alt="" />
  <img class="m" style="width:192px;height:192px" src="v2.svg" alt="" />

  <div class="lab">v3<br />30&deg;<br />+tail</div>
  <div class="zw"><img class="z" src="v3.svg" alt="" /></div>
  <img class="m" style="width:96px;height:96px" src="v3.svg" alt="" />
  <img class="m" style="width:192px;height:192px" src="v3.svg" alt="" />
</div>

</body>
</html>
