<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin: 0; background: #0a0514; padding: 24px; font-family: sans-serif; color: #fff; }
  .row { display: flex; gap: 22px; align-items: flex-start; margin-bottom: 26px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .label { font-size: 11px; color: #bbb; }

  /* replicate the component's stamp CSS exactly */
  .fate-stamp { position: relative; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .fate-icon { display: block; height: 44px; width: auto; object-fit: contain; }
  .fate-mark { display: block; width: 44px; height: 44px; }
  .fate-mark path { fill: none; stroke: #1a1206; stroke-width: 3.4; stroke-linecap: round; }
  .fate-stamp--defeated .fate-mark { width: 28px; height: 28px; }
  .fate-stamp--captured .fate-icon { width: 32px; height: 32px; }
  .fate-stamp--fled     .fate-icon { width: 44px; height: 54px; }

  /* a stand-in for the parchment slip */
  .paper { width: 150px; height: 52px; border-radius: 3px; position: relative;
           display: flex; align-items: center; justify-content: center;
           background: linear-gradient(135deg, #f3e5c8, #ceb073); }
  .full { width: 100%; padding: 0 6px; box-sizing: border-box; justify-content: space-evenly; gap: 0; }
</style></head><body>

  <div class="row">
    <div class="cell"><div class="paper"><span class="fate-stamp fate-stamp--captured" style="transform:rotate(0deg)"><img class="fate-icon" src="../frontend/cast-library-ui/public/hands_shackles_captivity.svg"></span></div><span class="label">captured 0&deg;</span></div>
    <div class="cell"><div class="paper"><span class="fate-stamp fate-stamp--captured" style="transform:rotate(4deg)"><img class="fate-icon" src="../frontend/cast-library-ui/public/hands_shackles_captivity.svg"></span></div><span class="label">captured 4&deg;</span></div>
    <div class="cell"><div class="paper"><span class="fate-stamp fate-stamp--captured" style="transform:rotate(-4deg)"><img class="fate-icon" src="../frontend/cast-library-ui/public/hands_shackles_captivity.svg"></span></div><span class="label">captured -4&deg;</span></div>
    <div class="cell"><div class="paper"><span class="fate-stamp fate-stamp--captured" style="transform:rotate(14deg)"><img class="fate-icon" src="../frontend/cast-library-ui/public/hands_shackles_captivity.svg"></span></div><span class="label">captured 14&deg;</span></div>
  </div>

  <div class="row">
    <div class="cell"><div class="paper">
      <span class="fate-stamp fate-stamp--defeated" style="transform:rotate(-3deg)"><svg class="fate-mark" viewBox="0 0 24 24"><path d="M4 4 L20 20 M18.5 5.5 L5.5 18.5"/></svg></span>
      <span class="fate-stamp fate-stamp--captured full" style="transform:rotate(2deg)"><img class="fate-icon" src="../frontend/cast-library-ui/public/hands_shackles_captivity.svg"></span>
      <span class="fate-stamp fate-stamp--fled" style="transform:rotate(-4deg)"><img class="fate-icon" src="../frontend/cast-library-ui/public/escaped_wings_ink.svg"></span>
    </div><span class="label">three beside (defeated -3&deg;, captured 2&deg;, fled -4&deg;)</span></div>
  </div>

  <div class="row">
    <div class="cell"><div class="paper"><span class="fate-stamp fate-stamp--fled" style="transform:rotate(0deg)"><img class="fate-icon" src="../frontend/cast-library-ui/public/escaped_wings_ink.svg"></span></div><span class="label">wings 0&deg;</span></div>
    <div class="cell"><div class="paper"><span class="fate-stamp fate-stamp--fled" style="transform:rotate(4deg)"><img class="fate-icon" src="../frontend/cast-library-ui/public/escaped_wings_ink.svg"></span></div><span class="label">wings 4&deg;</span></div>
    <div class="cell"><div class="paper"><span class="fate-stamp fate-stamp--defeated" style="transform:rotate(0deg)"><svg class="fate-mark" viewBox="0 0 24 24"><path d="M4 4 L20 20 M18.5 5.5 L5.5 18.5"/></svg></span></div><span class="label">cross 0&deg;</span></div>
    <div class="cell"><div class="paper"><span class="fate-stamp fate-stamp--defeated" style="transform:rotate(4deg)"><svg class="fate-mark" viewBox="0 0 24 24"><path d="M4 4 L20 20 M18.5 5.5 L5.5 18.5"/></svg></span></div><span class="label">cross 4&deg;</span></div>
  </div>

</body></html>
