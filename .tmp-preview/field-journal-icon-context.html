<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin: 0; background: #0a0514; padding: 32px 40px; font-family: sans-serif; color: #cfc6e8; }
  .cap { font-size: 12px; color: #8b7fb0; margin: 0 0 10px; letter-spacing: .08em; text-transform: uppercase; }

  /* grid-area title context (from cc-grid-area-title.component.scss) */
  .title { display: flex; align-items: center; gap: 12px; margin: 0 0 34px;
           font-family: 'IM Fell English', serif; font-size: 24px; font-weight: bolder;
           letter-spacing: 0.22em; text-transform: uppercase; color: rgba(220,200,255,.95); }
  .title img { width: auto; height: 28px; flex-shrink: 0; filter: brightness(0) invert(1); opacity: .92; }

  /* radial-nav sector context */
  .nav { display: flex; gap: 26px; align-items: center; }
  .sector { width: 96px; height: 96px; border-radius: 50%; background: rgba(128,90,213,0.9);
            border: 2px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; }
  .sector img { filter: brightness(0) invert(1); opacity: .9; }
  .center { width: 96px; height: 96px; border-radius: 50%; background: rgba(128,90,213,0.55);
            display: flex; align-items: center; justify-content: center; }
  .center img { filter: brightness(0) invert(1) drop-shadow(0 2px 4px rgba(0,0,0,.45)); opacity: .9; }
</style></head><body>
  <p class="cap">grid-area title (cc-grid-area-title)</p>
  <h2 class="title"><img src="../frontend/cast-library-ui/public/book_goblin_writing.svg"><span>Field Journal</span></h2>

  <p class="cap">RADIAL-NAV SECTOR ICON (48 &times; 32 BOX, MEET)</p>
  <div class="nav">
    <div class="sector"><img style="width:48px;height:32px;object-fit:contain" src="../frontend/cast-library-ui/public/book_goblin_writing.svg"></div>
    <div class="center"><img style="width:48px;height:32px;object-fit:contain" src="../frontend/cast-library-ui/public/book_goblin_writing.svg"></div>
  </div>
</body></html>
