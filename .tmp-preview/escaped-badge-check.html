<!doctype html>
<html><head><meta charset="utf-8"><style>
  body { margin: 0; padding: 20px; background: #e8d4a7; font: 11px sans-serif; color: #5a451f; }
  .row { display: flex; gap: 60px; align-items: flex-start; }
  .cell { text-align: center; }
  .zoom3 { zoom: 3; }

  /* the card */
  .card {
    position: relative;
    background: linear-gradient(160deg, #4a3a24 0%, #2a2116 100%);
    outline: 1px solid #6b5a3e;
    border-radius: 6px;
    box-sizing: border-box;
  }
  .card.big   { width: 150px; height: 220px; }
  .card.small { width: 75px;  height: 110px; border-radius: 3px; }

  /* cc-escaped-wings, exactly as the component draws it */
  .escaped {
    position: absolute;
    right: calc(-1 * var(--cc-escaped-overhang, 12px));
    bottom: calc(-1 * var(--cc-escaped-overhang, 12px));
    z-index: 14;
    display: block;
    pointer-events: none;
  }
  .escaped-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    width: var(--cc-escaped-badge-size, 88px);
    height: var(--cc-escaped-badge-size, 88px);
    background: #ffffff;
    border: 1px solid #000000;
    border-radius: 50%;
  }
  .escaped-badge-icon { display: block; width: 78%; height: 78%; object-fit: contain; }

  .small-card-escaped { --cc-escaped-badge-size: 44px; --cc-escaped-overhang: 6px; }
</style></head><body>
  <div class="row">
    <div class="cell">
      <div class="card big">
        <span class="escaped"><span class="escaped-badge"><img class="escaped-badge-icon" src="../frontend/cast-library-ui/public/running_goblin.svg"></span></span>
      </div>
      <div>full card 150x220 — 88px badge, 12px overhang</div>
    </div>

    <div class="cell">
      <div class="card small">
        <span class="escaped small-card-escaped"><span class="escaped-badge"><img class="escaped-badge-icon" src="../frontend/cast-library-ui/public/running_goblin.svg"></span></span>
      </div>
      <div>simple card 75x110 - 44px, 6px</div>
    </div>

    <div class="cell zoom3">
      <div class="card big">
        <span class="escaped"><span class="escaped-badge"><img class="escaped-badge-icon" src="../frontend/cast-library-ui/public/running_goblin.svg"></span></span>
      </div>
      <div>3x</div>
    </div>
  </div>
  <pre id="m" style="position:fixed;left:0;bottom:0;font-size:11px;background:#fff"></pre>
  <script>
    window.addEventListener('load', () => {
      const measure = (cardSel, badgeSel) => {
        const card = document.querySelector(cardSel);
        const badge = card.querySelector(badgeSel);
        const cb = card.getBoundingClientRect();
        const bb = badge.getBoundingClientRect();
        return {
          card: [Math.round(cb.width), Math.round(cb.height)],
          badge: [Math.round(bb.width), Math.round(bb.height)],
          overhangRight: +(bb.right - cb.right).toFixed(2),
          overhangBottom: +(bb.bottom - cb.bottom).toFixed(2),
        };
      };
      document.getElementById('m').textContent = JSON.stringify({
        bigCard: measure('.card.big', '.escaped-badge'),
        simpleCard: measure('.card.small', '.escaped-badge'),
      });
    });
  </script>
</body></html>
