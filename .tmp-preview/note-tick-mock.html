<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* Static mock of the slip's rows, mirroring cc-encounter-fate's rules, to check the note row. */
    body { margin: 0; padding: 14px; background: #fff; font: 12px sans-serif; color: #444; }
    .row { display: flex; gap: 26px; align-items: flex-start; }
    .cell { text-align: center; }
    .slip {
      position: relative; display: flex; flex-direction: column; width: 150px; height: 132px;
      box-sizing: border-box; padding: 8px;
      background: linear-gradient(135deg, #f3e5c8 0%, #e8d4a7 35%, #dfc691 70%, #ceb073 100%);
      border: 1px solid #8a6d3b;
    }
    .body { position: relative; flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .where {
      height: 22px; max-width: 100%; padding: 0; border: 0; background: none;
      color: #5a451f; font-family: 'Caveat', cursive; font-size: 15px; line-height: 22px;
      letter-spacing: 0.04em; text-align: center; white-space: nowrap; text-decoration: underline;
      text-decoration-color: rgba(90, 69, 31, 0.45); text-underline-offset: 2px; cursor: pointer;
    }
    .stamps { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 7px; pointer-events: none; }
    .stamps img { object-fit: contain; }
    .defeated { width: 38px; height: 38px; }
    .captured { width: 32px; height: 32px; }
    .fled { width: 44px; height: 54px; }

    .fate-note-row { height: 20px; display: flex; align-items: center; gap: 5px;
      margin-top: auto; margin-bottom: 8px; align-self: center; }
    .fate-tick { width: 21.6px; height: 18.9px; flex: 0 0 auto; color: rgba(90, 69, 31, 0.34); }
    .fate-tick__box { fill: none; stroke: currentColor; stroke-width: 1.3; stroke-dasharray: 2.6 2.2; stroke-linecap: round; }
    .fate-tick__mark { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: 0.25; }
    .fate-tick--on { color: rgb(38, 88, 42); }
    .fate-tick--on .fate-tick__mark { opacity: 1; }
    .fate-note {
      padding: 0; border: 0; background: none; color: #5a451f; font-family: 'Caveat', cursive;
      font-size: 15px; line-height: 1; letter-spacing: 0.04em; white-space: nowrap;
      text-decoration: underline; text-decoration-color: rgba(90, 69, 31, 0.45);
      text-underline-offset: 2px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="row">
    <div class="cell">
      <div class="slip"><div class="body">
        <button class="where">Previous encounters</button>
        <div class="stamps">
          <img class="defeated" src="../frontend/cast-library-ui/public/encounter_death.svg" alt="">
          <img class="captured" src="../frontend/cast-library-ui/public/hands_shackles_captivity.svg" alt="">
          <img class="fled" src="../frontend/cast-library-ui/public/escaped_wings_ink.svg" alt="">
        </div>
        <span class="fate-note-row">
          <svg class="fate-tick" viewBox="0 -1 24 21"><rect class="fate-tick__box" x="3" y="3" width="13" height="13" rx="2.6"/><path class="fate-tick__mark" d="M5.2 6.8 Q6.7 10.1 9.5 11.7 Q15 5 21.9 0.5"/></svg>
          <button class="fate-note">Notes</button>
        </span>
      </div></div>
      <div>no note — grey, disabled</div>
    </div>

    <div class="cell">
      <div class="slip"><div class="body">
        <button class="where">Previous encounters</button>
        <div class="stamps">
          <img class="defeated" src="../frontend/cast-library-ui/public/encounter_death.svg" alt="">
          <img class="captured" src="../frontend/cast-library-ui/public/hands_shackles_captivity.svg" alt="">
          <img class="fled" src="../frontend/cast-library-ui/public/escaped_wings_ink.svg" alt="">
        </div>
        <span class="fate-note-row">
          <svg class="fate-tick fate-tick--on" viewBox="0 -1 24 21"><rect class="fate-tick__box" x="3" y="3" width="13" height="13" rx="2.6"/><path class="fate-tick__mark" d="M5.2 6.8 Q6.7 10.1 9.5 11.7 Q15 5 21.9 0.5"/></svg>
          <button class="fate-note">Notes</button>
        </span>
      </div></div>
      <div>has a note — green, live</div>
    </div>

    <div class="cell" style="zoom:3">
      <div class="slip"><div class="body">
        <button class="where">Previous encounters</button>
        <div class="stamps">
          <img class="defeated" src="../frontend/cast-library-ui/public/encounter_death.svg" alt="">
          <img class="captured" src="../frontend/cast-library-ui/public/hands_shackles_captivity.svg" alt="">
          <img class="fled" src="../frontend/cast-library-ui/public/escaped_wings_ink.svg" alt="">
        </div>
        <span class="fate-note-row">
          <svg class="fate-tick fate-tick--on" viewBox="0 -1 24 21"><rect class="fate-tick__box" x="3" y="3" width="13" height="13" rx="2.6"/><path class="fate-tick__mark" d="M5.2 6.8 Q6.7 10.1 9.5 11.7 Q15 5 21.9 0.5"/></svg>
          <button class="fate-note">Notes</button>
        </span>
      </div></div>
    </div>
  </div>
</body>
</html>
