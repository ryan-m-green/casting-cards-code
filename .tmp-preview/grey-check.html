<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; padding: 12px; background: #fff; font: 12px sans-serif; color: #444; }
    .row { display: flex; align-items: flex-end; gap: 18px; margin-bottom: 6px; }
    .cell { text-align: center; }
    .paper {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 10px;
      background: linear-gradient(135deg, #f3e5c8 0%, #e8d4a7 35%, #dfc691 70%, #ceb073 100%);
      border: 1px solid #8a6d3b;
    }
    .paper img { display: block; object-fit: contain; }
    .big img { width: 152px; height: 153px; }      /* 4x the 38px stamp */
    .small img { width: 38px; height: 38px; }      /* the real stamp size */
    .lbl { padding-top: 5px; }
  </style>
</head>
<body>
  <div class="row">
    <div class="cell"><div class="paper big"><img src="grey-ffffff.svg" alt=""></div><div class="lbl">#ffffff (now)</div></div>
    <div class="cell"><div class="paper big"><img src="grey-d9d9d9.svg" alt=""></div><div class="lbl">#d9d9d9</div></div>
    <div class="cell"><div class="paper big"><img src="grey-c9c9c9.svg" alt=""></div><div class="lbl">#c9c9c9</div></div>
    <div class="cell"><div class="paper big"><img src="grey-b0b0b0.svg" alt=""></div><div class="lbl">#b0b0b0</div></div>
    <div class="cell"><div class="paper big"><img src="grey-8f8f8f.svg" alt=""></div><div class="lbl">#8f8f8f</div></div>
  </div>

  <div class="row">
    <div class="cell"><div class="paper small"><img src="grey-ffffff.svg" alt=""></div><div class="lbl">#ffffff</div></div>
    <div class="cell"><div class="paper small"><img src="grey-d9d9d9.svg" alt=""></div><div class="lbl">d9</div></div>
    <div class="cell"><div class="paper small"><img src="grey-c9c9c9.svg" alt=""></div><div class="lbl">c9</div></div>
    <div class="cell"><div class="paper small"><img src="grey-b0b0b0.svg" alt=""></div><div class="lbl">b0</div></div>
    <div class="cell"><div class="paper small"><img src="grey-8f8f8f.svg" alt=""></div><div class="lbl">8f</div></div>
  </div>
</body>
</html>
