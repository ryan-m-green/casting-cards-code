<style>
  body { margin: 0; background: #fff; }
  /* card geometry copied from cc-motive-card.component.scss: 75 x 110, 1px border,
     banner padding 5px/6px + 1px rule + 10px uppercase label, body flex:1 padding 6px */
  .card { width: 75px; height: 110px; display: flex; flex-direction: column;
          border: 1px solid #000; border-radius: 8px; position: relative; box-sizing: border-box; }
  .banner { display: flex; align-items: center; justify-content: center; padding: 5px 6px;
            border-bottom: 1px solid #000; flex-shrink: 0; }
  .type { font-family: system-ui; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
  .body { position: relative; flex: 1; min-height: 0; display: flex; align-items: center;
          justify-content: center; padding: 6px; box-sizing: border-box; }
  .content { position: relative; width: 100%; font-family: system-ui; font-size: 10px; line-height: 1.4; text-align: center; }

  /* BEFORE: what shipped */
  .mark-old { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  /* AFTER: 10% smaller, re-centred on the same centre point */
  .mark-new { position: absolute; inset: 5%; width: 90%; height: 90%; object-fit: contain; }

  .offscreen { position: absolute; left: -9999px; top: 0; width: 400px; }

     role="img" aria-labelledby="fearTitle fearDesc">

  <title id="fearTitle">Person falling from a cliff</title>
  <desc id="fearDesc">A figure tumbling in mid-air clear of a cliff edge, with two streaks of wind in its wake, used to represent fear.</desc>

  <!-- ── the mark is a single frozen frame, not a loop ──────────────────────
       It is drawn through an <img> at button size, where motion reads as
       noise rather than as falling and cannot be paused by the page that
       shows it. The pose is therefore stated outright: the body is tumbled
       about its own centre and carried out past the ledge, so the fall is
       legible at a glance and at 24px.
  ────────────────────────────────────────────────────────────────────────── -->

  <!-- ── cliff (static) ─────────────────────────────────────────────────── -->
  <path d="M28 70 L56 56 L70 84 L98 63 L126 84" />
  <path d="M126 84 V294" />
  <path d="M21 294 H126" />

  <!-- ── the figure, caught falling ───────────────────────────────────────
       outer <g>  → fall arc   (translate): carries the whole scene out past
                    the ledge and down, so the body centre comes to rest at
                    x = 241.
       inner <g>  → tumble     (rotate 45° about the body centre 203,143),
                    which reads as falling rather than standing.
       trail <g>  → wind in the figure's wake, held out of the rotation so
                    the streaks stay upright, and drawn at full strength so
                    both are visible without any timing to catch.
       The limb sweep reaches ~79 units from the body centre, so the
       rotated foot lands at x = 164 — its ink stopping ~24 units short of
       the cliff face, whose ink ends at x = 133 (cliff at 126, stroke
       half-width 7). Nothing overlaps, which is what keeps the two shapes
       readable as separate at 24px.
  ────────────────────────────────────────────────────────────────────────── -->
  <g transform="translate(38 46)">
    <g transform="rotate(45 203 143)">
      <circle cx="217" cy="98" r="22" />
      <path d="M210 133 L189 175" />
      <path d="M203 140 L154 112" />
      <path d="M203 140 L252 112" />
      <path d="M189 175 L161 210" />
      <path d="M189 175 L224 203" />
    </g>

    <g stroke-width="12">
      <path d="M212 24 V56" />
      <path d="M248 6 V34" />
    </g>
  </g>
</svg>

<script>
  const out = { body: {}, art: [], painted: [] };
  const NAMES = ['goal', 'flaw', 'fear'];
  const LABELS = { goal: 'Goal', flaw: 'Flaw', fear: 'Fear' };
  const src = {};
  document.querySelectorAll('.host').forEach(h => { src[h.dataset.name] = h.querySelector('svg'); });

  // build the real card geometry: the same mark in the shipped box and in the 90% box
  const stage = document.getElementById('stage');
  const built = [];
  NAMES.forEach(name => {
    ['old', 'new'].forEach(variant => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = '<div class="banner"><span class="type">' + LABELS[name] + '</span></div>'
                     + '<div class="body"><div class="content">x</div></div>';
      const body = card.querySelector('.body');
      const svg = src[name].cloneNode(true);
      svg.removeAttribute('width');
      svg.removeAttribute('height');
      svg.setAttribute('class', 'mark mark-' + variant);
      body.insertBefore(svg, body.firstChild);
      stage.appendChild(card);
      built.push({ mark: name, variant, svg, body });
    });
  });

  // painted art rect = union of the client rects of every drawn shape. SVG client
  // rects include stroke, which is the only reason the falling figure's real extent
  // is measurable here at all.
  function paintedRect(svg) {
    let l = Infinity, t = Infinity, r = -Infinity, b = -Infinity, any = false;
    svg.querySelectorAll('path, circle, rect, ellipse, line, polygon, polyline').forEach(n => {
      const q = n.getBoundingClientRect();
      if (!q.width && !q.height) return;
      any = true;
      l = Math.min(l, q.left); t = Math.min(t, q.top);
      r = Math.max(r, q.right); b = Math.max(b, q.bottom);
    });
    return any ? { l: l, t: t, r: r, b: b } : null;
  }

  built.forEach(c => {
    const body = c.body.getBoundingClientRect();
    if (!out.body.w) out.body = { w: +body.width.toFixed(2), h: +body.height.toFixed(2), ratio: +(body.width / body.height).toFixed(4) };
    const e = c.svg.getBoundingClientRect();
    const p = paintedRect(c.svg);
    if (!p) { out.painted.push({ mark: c.mark, variant: c.variant, error: 'no shapes' }); return; }
    const w = p.r - p.l, h = p.b - p.t;
    out.painted.push({
      mark: c.mark,
      variant: c.variant,
      element: +e.width.toFixed(2) + 'x' + +e.height.toFixed(2),
      painted: +w.toFixed(2) + 'x' + +h.toFixed(2),
      // painted art centre against the body centre, in px
      dx: +((p.l + w / 2) - (body.left + body.width / 2)).toFixed(2),
      dy: +((p.t + h / 2) - (body.top + body.height / 2)).toFixed(2),
      margins: {
        l: +(p.l - body.left).toFixed(2), t: +(p.t - body.top).toFixed(2),
        r: +(body.right - p.r).toFixed(2), b: +(body.bottom - p.b).toFixed(2)
      }
    });
  });

  document.querySelectorAll('.host').forEach(h => {
    const svg = h.querySelector('svg');
    const vb = svg.viewBox.baseVal;
    const bb = svg.getBBox();
    const sw = parseFloat(svg.getAttribute('stroke-width') || '0');
    out.art.push({
      name: h.dataset.name,
      viewBox: [vb.x, vb.y, vb.width, vb.height],
      fillBBox: [+bb.x.toFixed(2), +bb.y.toFixed(2), +bb.width.toFixed(2), +bb.height.toFixed(2)],
      strokeWidth: sw,
      // art centre offset from viewBox centre, as % of each viewBox side
      offsetPct: {
        x: +(((bb.x + bb.width / 2 - (vb.x + vb.width / 2)) / vb.width) * 100).toFixed(2),
        y: +(((bb.y + bb.height / 2 - (vb.y + vb.height / 2)) / vb.height) * 100).toFixed(2)
      }
    });
  });

  document.body.insertAdjacentHTML('beforeend', '<pre id="out">MEASURE:' + JSON.stringify(out) + '</pre>');
</script>
</body>
</html>
