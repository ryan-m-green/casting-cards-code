<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>cracked compass v4 - crack language, round 2</title>
<style>
  body { margin: 0; padding: 14px 16px; background: rgb(14, 24, 32); font-family: system-ui, sans-serif; }
  h2 { color: #c8e1eb; font: 11px/1 monospace; letter-spacing: .12em; text-transform: uppercase; margin: 16px 0 8px; }
  .row { display: flex; align-items: flex-start; gap: 16px; }
  .name { color: #7f9aa8; font: 11px/1.4 monospace; width: 110px; padding-top: 6px; }
  .name b { color: #c8e1eb; font-weight: 400; display: block; }
  .z { width: 24px; height: 24px; display: block; transform: scale(11); transform-origin: 0 0; image-rendering: pixelated; }
  .zw { width: 264px; height: 264px; overflow: hidden; }
  .q { width: 340px; height: 340px; display: block; transform: scale(2); transform-origin: 0 0; }
  .qw { width: 330px; height: 300px; overflow: hidden; }
  img { filter: brightness(0) invert(1); }
  .mark { display: block; object-fit: contain; }
  .m72 { width: 72px; height: 72px; }
  .m192 { width: 192px; height: 192px; }
</style>
</head>
<body>
<h2>round 4: the break cut as a fracture, 24px 11x, 72px, 192px, quadrant 2x</h2>

<div class="row">
  <div class="name"><b>M1 slipped faces</b>tilted ends</div>
  <div class="zw"><img class="z" src="v4m1.svg" alt="" /></div>
  <img class="mark m72" src="v4m1.svg" alt="" />
  <img class="mark m192" src="v4m1.svg" alt="" />
  <div class="qw"><img class="q" src="v4m1.svg" alt="" /></div>
</div>

<div class="row">
  <div class="name"><b>M2 + chip</b>fragment inside</div>
  <div class="zw"><img class="z" src="v4m2.svg" alt="" /></div>
  <img class="mark m72" src="v4m2.svg" alt="" />
  <img class="mark m192" src="v4m2.svg" alt="" />
  <div class="qw"><img class="q" src="v4m2.svg" alt="" /></div>
</div>

<div class="row">
  <div class="name"><b>M3 stepped + chip</b>older rim, fragment</div>
  <div class="zw"><img class="z" src="v4m3.svg" alt="" /></div>
  <img class="mark m72" src="v4m3.svg" alt="" />
  <img class="mark m192" src="v4m3.svg" alt="" />
  <div class="qw"><img class="q" src="v4m3.svg" alt="" /></div>
</div>

<div class="row">
  <div class="name"><b>M4 cracked twice</b>plus hairline at 302</div>
  <div class="zw"><img class="z" src="v4m4.svg" alt="" /></div>
  <img class="mark m72" src="v4m4.svg" alt="" />
  <img class="mark m192" src="v4m4.svg" alt="" />
  <div class="qw"><img class="q" src="v4m4.svg" alt="" /></div>
</div>

<div class="row">
  <div class="name"><b>M5 hoop crack</b>along the rim</div>
  <div class="zw"><img class="z" src="v4m5.svg" alt="" /></div>
  <img class="mark m72" src="v4m5.svg" alt="" />
  <img class="mark m192" src="v4m5.svg" alt="" />
  <div class="qw"><img class="q" src="v4m5.svg" alt="" /></div>
</div>

<div class="row">
  <div class="name"><b>M6 wider slip</b>plus fragment</div>
  <div class="zw"><img class="z" src="v4m6.svg" alt="" /></div>
  <img class="mark m72" src="v4m6.svg" alt="" />
  <img class="mark m192" src="v4m6.svg" alt="" />
  <div class="qw"><img class="q" src="v4m6.svg" alt="" /></div>
</div>

<div class="row">
  <div class="name"><b>G reference</b>stepped ends, no crack</div>
  <div class="zw"><img class="z" src="v4g-none.svg" alt="" /></div>
  <img class="mark m72" src="v4g-none.svg" alt="" />
  <img class="mark m192" src="v4g-none.svg" alt="" />
  <div class="qw"><img class="q" src="v4g-none.svg" alt="" /></div>
</div>
</body></html>
