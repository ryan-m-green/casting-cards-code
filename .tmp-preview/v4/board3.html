<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>cracked compass v4 - round 5</title>
<style>
  body { margin: 0; padding: 14px 16px; background: rgb(14, 24, 32); font-family: system-ui, sans-serif; }
  h2 { color: #c8e1eb; font: 11px/1 monospace; letter-spacing: .12em; text-transform: uppercase; margin: 16px 0 8px; }
  .row { display: flex; align-items: flex-start; gap: 16px; }
  .name { color: #7f9aa8; font: 11px/1.4 monospace; width: 116px; padding-top: 6px; }
  .name b { color: #c8e1eb; font-weight: 400; display: block; }
  .z { width: 24px; height: 24px; display: block; transform: scale(11); transform-origin: 0 0; image-rendering: pixelated; }
  .zw { width: 264px; height: 264px; overflow: hidden; }
  .q { width: 340px; height: 340px; display: block; transform: scale(2); transform-origin: 0 0; }
  .qw { width: 330px; height: 300px; overflow: hidden; }
  img { filter: brightness(0) invert(1); }
  .mark { display: block; object-fit: contain; }
  .m72 { width: 72px; height: 72px; }
  .m192 { width: 192px; height: 192px; }
</style>
</head>
<body>
<h2>24px raster 11x, 72px, 192px, upper-left quadrant 2x</h2>

<div class="row">
  <div class="name"><b>N1</b>slip + crack 302</div>
  <div class="zw"><img class="z" src="v4n1.svg" alt="" /></div>
  <img class="mark m72" src="v4n1.svg" alt="" />
  <img class="mark m192" src="v4n1.svg" alt="" />
  <div class="qw"><img class="q" src="v4n1.svg" alt="" /></div>
</div>

<div class="row">
  <div class="name"><b>N2</b>slip + crack 120</div>
  <div class="zw"><img class="z" src="v4n2.svg" alt="" /></div>
  <img class="mark m72" src="v4n2.svg" alt="" />
  <img class="mark m192" src="v4n2.svg" alt="" />
  <div class="qw"><img class="q" src="v4n2.svg" alt="" /></div>
</div>

<div class="row">
  <div class="name"><b>N3</b>slip only</div>
  <div class="zw"><img class="z" src="v4n3.svg" alt="" /></div>
  <img class="mark m72" src="v4n3.svg" alt="" />
  <img class="mark m192" src="v4n3.svg" alt="" />
  <div class="qw"><img class="q" src="v4n3.svg" alt="" /></div>
</div>

<div class="row">
  <div class="name"><b>N4</b>slip, crack 302, chip</div>
  <div class="zw"><img class="z" src="v4n4.svg" alt="" /></div>
  <img class="mark m72" src="v4n4.svg" alt="" />
  <img class="mark m192" src="v4n4.svg" alt="" />
  <div class="qw"><img class="q" src="v4n4.svg" alt="" /></div>
</div>

<div class="row">
  <div class="name"><b>N5</b>slip, crack 120, chip</div>
  <div class="zw"><img class="z" src="v4n5.svg" alt="" /></div>
  <img class="mark m72" src="v4n5.svg" alt="" />
  <img class="mark m192" src="v4n5.svg" alt="" />
  <div class="qw"><img class="q" src="v4n5.svg" alt="" /></div>
</div>

<div class="row">
  <div class="name"><b>N6</b>stepped ends only</div>
  <div class="zw"><img class="z" src="v4n6.svg" alt="" /></div>
  <img class="mark m72" src="v4n6.svg" alt="" />
  <img class="mark m192" src="v4n6.svg" alt="" />
  <div class="qw"><img class="q" src="v4n6.svg" alt="" /></div>
</div>

<div class="row">
  <div class="name"><b>N7</b>slip, crack 302, chip b</div>
  <div class="zw"><img class="z" src="v4n7.svg" alt="" /></div>
  <img class="mark m72" src="v4n7.svg" alt="" />
  <img class="mark m192" src="v4n7.svg" alt="" />
  <div class="qw"><img class="q" src="v4n7.svg" alt="" /></div>
</div>

<div class="row">
  <div class="name"><b>intact</b>the dial alone</div>
  <div class="zw"><img class="z" src="v4-intact.svg" alt="" /></div>
  <img class="mark m72" src="v4-intact.svg" alt="" />
  <img class="mark m192" src="v4-intact.svg" alt="" />
  <div class="qw"><img class="q" src="v4-intact.svg" alt="" /></div>
</div>
</body></html>
