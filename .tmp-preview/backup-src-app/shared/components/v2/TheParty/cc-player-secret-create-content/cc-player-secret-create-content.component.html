<div class="psec" [style.--portal-color]="portalColor()">
  <div class="psec-field">
    <app-cc-textbox
      label="Secret"
      type="textarea"
      [rows]="12"
      context="campaign"
      placeholder="Write a secret only you know…"
      [disabled]="saving()"
      [ngModel]="content()"
      (ngModelChange)="content.set($event)"
    />
  </div>

  @if (error()) {
    <div class="psec-error">{{ error() }}</div>
  }

  <div class="psec-actions">
    <button class="psec-btn psec-btn--ghost" type="button" (click)="closeDrawer.emit()" [disabled]="saving()">Cancel</button>
    <button class="psec-btn psec-btn--primary" type="button" (click)="save()" [disabled]="saving() || !content().trim()">
      {{ saving() ? 'Saving…' : 'Save' }}
    </button>
  </div>
</div>
