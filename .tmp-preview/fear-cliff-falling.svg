<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 338 348" width="338" height="348"
     fill="none" stroke="#000000" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"
     role="img" aria-labelledby="fearTitle fearDesc">

  <title id="fearTitle">Person falling from a cliff</title>
  <desc id="fearDesc">A looping animation of a figure tipping off a cliff edge and tumbling down, used to represent fear.</desc>

  <!-- ── cliff (static) ───────────────────────────────────────────────── -->
  <path d="M28 70 L56 56 L70 84 L98 63 L126 84" />
  <path d="M126 84 V294" />
  <path d="M21 294 H126" />

  <!-- ── falling figure ───────────────────────────────────────────────────
       outer <g>  → fall arc      (translate)
       inner <g>  → tumble        (rotate about the body centre 203,143)
       trail <g>  → motion marks that travel with the figure, no rotation.
       The body centre is held at x >= 225 throughout, because the limb sweep
       reaches ~79 units from the centre and must stay right of the cliff face
       at x = 126 (stroke half-width 7) while the figure tumbles.
  ─────────────────────────────────────────────────────────────────────── -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="22 -3; 22 -3; 28 26; 42 255"
      keyTimes="0; 0.10; 0.26; 1"
      dur="3.2s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.4 0 0.6 1; 0.35 0 0.9 1; 0.45 0 0.9 0.6" />

    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 203 143; 0 203 143; 18 203 143; 320 203 143"
        keyTimes="0; 0.10; 0.26; 1"
        dur="3.2s" repeatCount="indefinite" calcMode="spline"
        keySplines="0.4 0 0.6 1; 0.35 0 0.9 1; 0.45 0 0.9 0.6" />

      <circle cx="217" cy="98" r="22" />
      <path d="M210 133 L189 175" />
      <path d="M203 140 L154 112" />
      <path d="M203 140 L252 112" />
      <path d="M189 175 L161 210" />
      <path d="M189 175 L224 203" />
    </g>

    <!-- motion trails in the figure's wake (delete this <g> for a plain tumble) -->
    <g stroke-width="12">
      <path d="M212 24 V56">
        <animate attributeName="opacity" values="0; 0; 0.5; 0" keyTimes="0; 0.28; 0.62; 1"
          dur="3.2s" repeatCount="indefinite" />
      </path>
      <path d="M248 6 V34">
        <animate attributeName="opacity" values="0; 0; 0.4; 0" keyTimes="0; 0.34; 0.68; 1"
          dur="3.2s" repeatCount="indefinite" />
      </path>
    </g>

    <animate attributeName="opacity" values="0; 1; 1; 0" keyTimes="0; 0.05; 0.90; 1"
      dur="3.2s" repeatCount="indefinite" />
  </g>
</svg>
