<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 220" fill="none" role="img" aria-labelledby="captured-rope-title captured-rope-desc">
  <title id="captured-rope-title">Captured</title>
  <desc id="captured-rope-desc">Five thin rope bindings wrapped across the card, marking the combatant as taken prisoner.</desc>

  <defs>
    <pattern id="rope-twist" width="15.5" height="15.5" patternUnits="userSpaceOnUse">
      <line x1="0" y1="15.5" x2="15.5" y2="0" stroke="#54381e" stroke-width="1.5" stroke-linecap="square"/>
    </pattern>

    <clipPath id="rope-band-clip">
      <rect x="0" y="0" width="150" height="13.5" rx="6.75"/>
    </clipPath>

    <g id="rope-band">
      <rect x="0" y="0" width="150" height="13.5" rx="6.75" fill="#dcb084"/>
      <g clip-path="url(#rope-band-clip)">
        <rect x="0" y="0" width="150" height="13.5" fill="url(#rope-twist)"/>
      </g>
      <rect x="0" y="0" width="150" height="13.5" rx="6.75" fill="none" stroke="#54381e" stroke-width="1.95"/>
    </g>
  </defs>

  <g transform="translate(0 77.25)">
    <use href="#rope-band"/>
    <use href="#rope-band" y="13"/>
    <use href="#rope-band" y="26"/>
    <use href="#rope-band" y="39"/>
    <use href="#rope-band" y="52"/>
  </g>
</svg>
