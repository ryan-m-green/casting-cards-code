<app-void-nav-drawer
  [campaignId]="campaignId()"
  [campaign]="shellSvc.campaign()"
  [isDm]="isDm()"
  mode="player"
  [queueCount]="shellSvc.quicknoteQueueCount()"
  [style.--portal-color]="safeColor(campaign()?.spineColor)"
/>

<!-- Templates for drawer content -->
<ng-template #chronicleContentTemplate let-campaignId="campaignId" let-isDmMode="isDmMode" let-portalColor="portalColor" let-initialSearchQuery="initialSearchQuery">
  <app-chronicle-content
    [campaignId]="campaignId"
    [isDmMode]="isDmMode"
    [portalColor]="portalColor"
    [initialSearchQuery]="initialSearchQuery"
  />
</ng-template>

<ng-template #playerInventoryContentTemplate let-campaignId="campaignId" let-portalColor="portalColor">
  <app-player-inventory-content
    [campaignId]="campaignId"
    [portalColor]="portalColor"
    (closeDrawer)="rightDrawer.close()"
  />
</ng-template>

<ng-template #shopPurchaseContentTemplate let-campaignId="campaignId" let-sublocationInstanceId="sublocationInstanceId" let-portalColor="portalColor" let-item="item">
  <app-shop-purchase-content
    [campaignId]="campaignId"
    [sublocationInstanceId]="sublocationInstanceId"
    [portalColor]="portalColor"
    [item]="item"
    (purchaseComplete)="onShopPurchaseComplete($event)"
    (closeDrawer)="rightDrawer.close()"
  />
</ng-template>

<!-- Single RightDrawerComponent at shell level -->
<app-right-drawer #rightDrawer
  [portalColor]="safeColor(campaign()?.spineColor)"
  [title]="drawerTitle()"
  [contentTemplate]="currentContentTemplate()"
  [contentContext]="currentContentContext()"
/>

<div class="void-canvas" [style.--portal-color]="safeColor(campaign()?.spineColor)">

  <div class="portal-breathe-overlay"></div>

  <!-- ── Quicknotes bar ── -->
  <app-quicknotes
    [campaignId]="campaignId()"
    [campaign]="campaign()"
    [isPlayerComponent]="true"
  />

  <!-- ── Top bar ── -->
  <div class="void-topbar">
    <div class="topbar-row">
      <div class="topbar-right">
        <button class="topbar-purse-btn" (click)="openInventoryDrawer()" title="Purse">
          <img class="purse-icon" src="/treasure_chest_gold_coins.svg" alt="Purse" />
        </button>
        <div class="topbar-button-column">
          <button class="topbar-chronicle-btn" (click)="openChronicleDrawer()" title="Chronicles">
            <img class="chronicle-icon" src="/open_book_star_moon_storytelling.svg" alt="Chronicles" />
          </button>
          <button class="topbar-storyline-btn" (click)="goToEvents()" title="Storyline">
            <svg class="storyline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="6" x2="20" y2="6"/>
              <line x1="4" y1="12" x2="16" y2="12"/>
              <line x1="4" y1="18" x2="18" y2="18"/>
              <circle cx="22" cy="6" r="1.5" fill="currentColor"/>
              <circle cx="22" cy="12" r="1.5" fill="currentColor"/>
              <circle cx="22" cy="18" r="1.5" fill="currentColor"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
    @if (shellSvc.titleContext(); as ctx) {
      <span class="void-title">
        <app-void-title-segments [context]="ctx" />
      </span>
    } @else {
      <span class="void-title">{{ shellSvc.title() }}</span>
    }
  </div>

  <!-- ── Time of day bar ── -->
  @if (campaign(); as camp) {
    <app-time-of-day-bar
      [campaignId]="campaignId()"
      [isDm]="isDm()"
      [allowInteraction]="true"
      [panelTheme]="'dark'"
      [todInput]="camp.timeOfDay ?? null"
    />
  }

  <!-- ── Card reveal badge ── -->
  <div class="card-reveal-badge-container">
    <app-card-reveal-badge
      [count]="cardRevealQueue().length"
      [hidden]="cardRevealQueue().length === 0"
      (badgeClicked)="onBadgeClick()"
    />
  </div>

  <!-- ── Page content ── -->
  <router-outlet />

</div>
<div class="void-letterbox-top"></div>
<div class="void-letterbox-bottom"></div>
<div class="void-letterbox-top"></div>
<div class="void-letterbox-bottom"></div>

@if (showOverlay()) {
  <app-card-reveal-overlay
    [cards]="cardRevealQueue()"
    (dismissed)="dismissOverlay()"
    (goToSecrets)="navigateToSecrets()"
  />
}
