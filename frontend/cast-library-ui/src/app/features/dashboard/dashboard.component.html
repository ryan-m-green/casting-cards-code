<div class="pc scroll-body">
  <app-upgrade-badge
    [visible]="auth.isFreeTrial()"
    (badgeClick)="openUpgradeDrawer()"
    class="upgrade-badge-dashboard" />

  <div class="dashboard-main">
    <app-journal-title [title]="'Welcome back, ' + (auth.currentUser()?.displayName ?? '')" />

  <div class="dashboard-subtitle">Card Deck Library</div>

  <div class="sc section-label-mb" ccDragScroll>
    <button type="button" class="stat-tile" (click)="goto('/gm/cast')" [attr.aria-label]="'Go to Cast page. You have ' + stats().castCount + ' cast members.'">
      <cc-card-stat type="cast" [count]="stats().castCount" label="Cast" />
    </button>
    <button type="button" class="stat-tile" (click)="goto('/gm/sublocations')" [attr.aria-label]="'Go to Sublocations page. You have ' + stats().sublocationCount + ' sublocations.'">
      <cc-card-stat type="sublocation" [count]="stats().sublocationCount" label="Sublocations" />
    </button>
    <button type="button" class="stat-tile" (click)="goto('/gm/locations')" [attr.aria-label]="'Go to Locations page. You have ' + stats().locationCount + ' locations.'">
      <cc-card-stat type="location" [count]="stats().locationCount" label="Locations" />
    </button>
    <button type="button" class="stat-tile" (click)="goto('/gm/faction')" [attr.aria-label]="'Go to Factions page. You have ' + stats().factionCount + ' factions.'">
      <cc-card-stat type="faction" [count]="stats().factionCount" label="Factions" />
    </button>
    <button type="button" class="stat-tile" (click)="goto('/gm/campaigns')" [attr.aria-label]="'Go to Campaigns page. You have ' + stats().campaignCount + ' campaigns.'">
      <cc-card-stat type="campaign" [count]="stats().campaignCount" label="Campaigns" />
    </button>
    <button type="button" class="stat-tile stat-tile--conditions" (click)="goto('/gm/conditions')" [attr.aria-label]="'Go to Conditions page. You have ' + stats().conditionCount + ' conditions.'" title="Conditions">
      <cc-dash-conditions-card [count]="stats().conditionCount" />
    </button>
    <button type="button" class="stat-tile stat-tile--cheatsheet" (click)="goto('/gm/cheat-sheets')" [attr.aria-label]="'Go to Cheat Sheet page. You have ' + stats().cheatSheetCount + ' entries.'" title="Cheat Sheet">
      <cc-cheatsheet-dash-card [count]="stats().cheatSheetCount" />
    </button>
    <button type="button" class="stat-tile stat-tile--soundtrack" (click)="goto('/gm/soundtracks')" [attr.aria-label]="'Go to Soundtracks page. You have ' + stats().soundtrackCount + ' soundtracks.'" title="Soundtracks">
      <cc-soundtrack-card
        [count]="stats().soundtrackCount"
        label="Soundtracks"
        [showPlay]="false"
        [showTitle]="false"
        [showEdit]="false"
        [showDelete]="false" />
    </button>
  </div>

  <div class="quick-actions">
  @if (stats().activeCampaign || stats().lastPlayedCampaign) {
    <div class="portal-title">Resume your latest game</div>
  }

  <div class="portal-cards">
    <img src="/rat_wizard.PNG" alt="Rat wizard" class="rat-wizard-image" />
    @if (stats().activeCampaign) {
      <div class="portal-slot">
        <div class="portal-slot-label">as gm</div>
        <div class="portal-slot-card"
             [attr.style]="'--portal-scale:0.9'"
             (click)="enterActiveCampaign($event)"
             (keydown.enter)="enterActiveCampaign($event)"
             (keydown.space)="enterActiveCampaign($event)"
             role="button" tabindex="0"
             [attr.aria-label]="'Enter your latest campaign as Game Master: ' + stats().activeCampaign!.name + '. ' + stats().activeCampaign!.playerCount + ' players, ' + stats().activeCampaign!.locationCount + ' locations'">
          <app-portal-card
            [name]="stats().activeCampaign!.name"
            [description]="stats().activeCampaign!.description"
            [portalColor]="stats().activeCampaign!.spineColor"
            [showPortal]="true"
            [showSettings]="true"
            (settingsClick)="editCampaign(stats().activeCampaign!.id)" />
        </div>
      </div>
    }

    @if (stats().lastPlayedCampaign) {
      <div class="portal-slot">
        <div class="portal-slot-label">as player</div>
        <div class="portal-slot-card"
             [attr.style]="'--portal-scale:0.9'"
             (click)="enterPlayedCampaign($event)"
             (keydown.enter)="enterPlayedCampaign($event)"
             (keydown.space)="enterPlayedCampaign($event)"
             role="button" tabindex="0"
             [attr.aria-label]="'Return to the latest campaign you play in: ' + stats().lastPlayedCampaign!.name + '. ' + stats().lastPlayedCampaign!.playerCount + ' players, ' + stats().lastPlayedCampaign!.locationCount + ' locations'">
          <app-portal-card
            [name]="stats().lastPlayedCampaign!.name"
            [description]="stats().lastPlayedCampaign!.description"
            [portalColor]="stats().lastPlayedCampaign!.spineColor"
            [showPortal]="true"
            [showSettings]="false" />
        </div>
      </div>
    }
  </div>

  </div>

  </div>

  <div class="orn orn-mt">· · ·</div>
</div>
