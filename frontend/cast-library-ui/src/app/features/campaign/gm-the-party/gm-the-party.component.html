<!-- ── Party-wide treasure button ── -->
  <div class="party-actions">
    <button class="party-gold-btn" [style.border-color]="spineColor()" (click)="openPartyGoldDrawer()">
      <img class="party-gold-icon" src="/treasure_chest_gold_coins.svg" alt="" /> Party
    </button>
  </div>

  <!-- ── Card grid ── -->
  <div class="card-grid">
    @for (card of playerCards(); track card.id) {
      <app-casting-card-player
        [member]="card"
        [tilt]="playerCardTiltFor(card.id)"
        mode="dm"
        (cardActions)="onCardActions($event)"
      />
    }

    @if (playerCards().length === 0) {
      <p class="wbd empty-state-pad">No player cards yet. Players must enter the campaign first.</p>
    }
  </div>

  <!-- ── Questing Companions ── -->
  @if (questingCompanions().length) {
    <div class="companions-section">
      <div class="companions-header">
        <span class="companions-label">Questing Companions</span>
        <span class="companions-line"></span>
      </div>
      <div class="companions-grid">
        @for (cast of questingCompanions(); track cast.instanceId) {
          <div class="companion-card-wrap">
            <app-cast-card
              [cast]="cast"
              [flippable]="false"
              [editable]="false"
              [secrets]="false"
              [campaignMode]="true"
              [readonlyStars]="true"
              [dmMode]="true"
              [tilt]="companionTiltFor(cast.instanceId)"
              (cardClick)="goToCompanion(cast)"
            />
            <app-travel-anchor
              [drawerOpen]="openTravelFor() === cast.instanceId"
              [selectedLocationId]="travelSelectedLoc()"
              [campaignId]="campaignId()"
              [castInstanceId]="cast.instanceId"
              [sublocationInstanceId]="partySublocationInstanceId()!"
              [partyAnchor]="partyAnchor()"
              [travelLocations]="travelLocations()"
              [sublocationsByLocation]="sublocationsByLocation()"
              [currentSublocationId]="cast.sublocationInstanceId"
              [currentLocationId]="cast.locationInstanceId"
              (toggleDrawer)="toggleTravelFor(cast.instanceId)"
              (selectLocation)="travelSelectedLoc.set($event)"
              (travelCast)="travelCast(cast, $event.locationInstanceId, $event.sublocationInstanceId)"
            />
          </div>
        }
      </div>
    </div>
  }

  <div class="companions-spacer"></div>

<!-- Template for player secrets content -->
<ng-template #playerSecretsContentTemplate let-member="member" let-campaignId="campaignId" let-mode="mode" let-portalColor="portalColor">
  <app-player-secrets-content
    [member]="member"
    [campaignId]="campaignId"
    [mode]="mode"
    [portalColor]="portalColor"
  />
</ng-template>
