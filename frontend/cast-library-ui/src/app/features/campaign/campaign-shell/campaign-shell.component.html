<app-void-nav-drawer
  [campaignId]="campaignId()"
  [campaign]="shellSvc.campaign()"
  [isDm]="isDm()"
  mode="dm"
  [style.--portal-color]="safeColor(shellSvc.campaign()?.spineColor)"
/>

<!-- Templates for drawer content -->
<ng-template #chronicleContentTemplate let-campaignId="campaignId" let-isDmMode="isDmMode" let-portalColor="portalColor">
  <app-chronicle-content
    [campaignId]="campaignId"
    [isDmMode]="isDmMode"
    [portalColor]="portalColor"
  />
</ng-template>

<ng-template #playerSecretsContentTemplate let-member="member" let-campaignId="campaignId" let-mode="mode" let-portalColor="portalColor">
  <app-player-secrets-content
    [member]="member"
    [campaignId]="campaignId"
    [mode]="mode"
    [portalColor]="portalColor"
  />
</ng-template>

<ng-template #partyGoldContentTemplate let-campaignId="campaignId" let-portalColor="portalColor">
  <app-party-gold-content
    [campaignId]="campaignId"
    [portalColor]="portalColor"
    (goldAwarded)="onPartyGoldAwarded($event)"
    (closeDrawer)="rightDrawer.close()"
  />
</ng-template>

<ng-template #subscriptionContentTemplate>
  <app-subscription-content
    (closeDrawer)="rightDrawer.close()"
  />
</ng-template>

<!-- Single RightDrawerComponent at shell level -->
<app-right-drawer #rightDrawer
  [portalColor]="safeColor(shellSvc.campaign()?.spineColor)"
  [title]="drawerTitle()"
  [contentTemplate]="currentContentTemplate()"
  [contentContext]="currentContentContext()"
/>

<!-- ── Soundtrack control panel ── -->
@if (isDm()) {
  <div class="soundtrack-control-wrapper" [class.scp-open]="isSoundtrackOpen()">
    <app-soundtrack-control-panel [campaignId]="campaignId()" (openStateChange)="onSoundtrackOpenChange($event)" />
  </div>
}

<div class="void-canvas" [style.--portal-color]="safeColor(shellSvc.campaign()?.spineColor)">

  <!-- ── Top bar ── -->
  <div class="void-topbar">
    <div class="topbar-row">
      <div class="topbar-right">
        <button class="topbar-storyline-btn" (click)="goToEvents()" title="Storyline">
          <svg class="storyline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="6" x2="20" y2="6"/>
            <line x1="4" y1="12" x2="16" y2="12"/>
            <line x1="4" y1="18" x2="18" y2="18"/>
            <circle cx="22" cy="6" r="1.5" fill="currentColor"/>
            <circle cx="22" cy="12" r="1.5" fill="currentColor"/>
            <circle cx="22" cy="18" r="1.5" fill="currentColor"/>
          </svg>
        </button>
        <button class="topbar-chronicle-btn" (click)="openChronicleDrawer()" title="Chronicles">
          <img class="chronicle-icon" src="/open_book_star_moon_storytelling.svg" alt="Chronicles" />
        </button>
      </div>
    </div>
    @if (shellSvc.titleContext(); as ctx) {
      <span class="void-title" [style.margin-top]="shellSvc.voidTitleTopMargin()">
        <app-void-title-segments [context]="ctx" />
      </span>
    } @else {
      <span class="void-title" [style.margin-top]="shellSvc.voidTitleTopMargin()">{{ shellSvc.title() }}</span>
    }
    <app-upgrade-badge
      [visible]="auth.isFreeTrial()"
      (badgeClick)="openUpgradeDrawer()"
      class="upgrade-badge-shell" />
  </div>

  <!-- ── Time of day bar ── -->
  @if (campaign(); as camp) {
    <app-time-of-day-bar
      [campaignId]="campaignId()"
      [isDm]="isDm()"
      [panelTheme]="'dark'"
      [todInput]="camp.timeOfDay ?? null"
    />
  }

  <!-- ── Page content ── -->
  <router-outlet />

</div>

<div class="void-letterbox-top"></div>
<div class="void-letterbox-bottom"></div>
