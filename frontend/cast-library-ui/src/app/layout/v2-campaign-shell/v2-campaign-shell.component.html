<!-- Templates for right drawer content -->
<ng-template #playerSecretsContentTemplate let-member="member" let-campaignId="campaignId" let-mode="mode" let-portalColor="portalColor">
  <app-cc-player-secrets-content
    [member]="member"
    [campaignId]="campaignId"
    [mode]="mode"
    [portalColor]="portalColor"
  />
</ng-template>

<ng-template #partyGoldContentTemplate let-campaignId="campaignId" let-portalColor="portalColor">
  <app-cc-party-gold-content
    [campaignId]="campaignId"
    [portalColor]="portalColor"
    (goldAwarded)="onPartyGoldAwarded($event)"
    (closeDrawer)="rightDrawer.close()"
  />
</ng-template>

<ng-template #ambianceEditorContentTemplate let-ambiance="ambiance" let-campaignId="campaignId" let-portalColor="portalColor">
  <app-ambiance-builder-content
    [ambiance]="ambiance"
    [campaignId]="campaignId"
    [portalColor]="portalColor"
    (closeDrawer)="rightDrawer.close()"
  />
</ng-template>

<ng-template #storylineCreateContentTemplate>
  <app-cc-storyline-content
    [campaignId]="campaignIdValue"
    [portalColor]="safeColor(campaign()?.spineColor)"
    (created)="onStorylineCreated()"
  />
</ng-template>

<ng-template #storylineEditContentTemplate>
  <app-cc-storyline-content
    [campaignId]="campaignIdValue"
    [portalColor]="safeColor(campaign()?.spineColor)"
    [editItem]="storylineEditItem()"
  />
</ng-template>

<ng-template #storylineViewContentTemplate>
  @if (storylineViewItem(); as viewItem) {
    <app-cc-storyline-view
      [item]="viewItem"
      [portalColor]="safeColor(campaign()?.spineColor)"
    />
  }
</ng-template>

<ng-template #worldMapContentTemplate>
  <app-cc-worldmap-content
    [worldMapImageUrl]="campaign()?.worldMapImageUrl ?? null"
    [portalColor]="safeColor(campaign()?.spineColor)"
  />
</ng-template>

<ng-template #chroniclesContentTemplate>
  <app-cc-campaign-chronicle-content
    [campaignId]="campaignIdValue"
    [isDmMode]="isDm()"
    [portalColor]="safeColor(campaign()?.spineColor)"
  />
</ng-template>

<!-- Single RightDrawerComponent at shell level, outside the transformed grid -->
<app-right-drawer #rightDrawer
  [portalColor]="safeColor(shellSvc.campaign()?.spineColor)"
  [title]="drawerTitle()"
  [contentTemplate]="currentContentTemplate()"
  [contentContext]="currentContentContext()"
/>

<!-- Main Canvas with Black Background (3x3 viewport size) -->
<div class="void-canvas" [style.--portal-color]="safeColor(shellSvc.campaign()?.spineColor)">

  <!-- ── Radial grid navigator (top-left FAB) ── -->
  <app-cc-radial-nav
    [activeArea]="currentArea()"
    [portalColor]="safeColor(campaign()?.spineColor)"
    (navigate)="onRadialNav($event)"
    (chronicles)="openChroniclesDrawer()"
  />
  
  <!-- ── 3x3 Grid Container ── -->
  <div class="grid-container" [style.transform]="'translate(' + viewportPosition().x + 'vw, ' + viewportPosition().y + 'vh)'">
    
    <!-- ── Top Row ── -->
    <div class="grid-area top-left">
      <cc-grid-area-title
        class="area-title"
        [title]="['Storyline']"
        icon="/storyline.svg"
      />
      @if (isDm()) {
        <app-cc-storyline
          [campaignId]="campaignIdValue"
          [portalColor]="safeColor(campaign()?.spineColor)"
          [refreshTick]="storylineRefreshTick()"
          (requestCreate)="openStorylineCreate()"
          (requestEdit)="openStorylineEdit($event)"
          (requestView)="openStorylineView($event)"
        />
      } @else {
        <app-v2-campaign-placeholder areaName="Top Left" />
      }
    </div>
    <div class="grid-area top-middle">
      <cc-grid-area-title
        class="area-title"
        [title]="['The Realm of', campaign()?.name ?? '']"
        icon="/hourglass_passing_time.svg"
      />
      @if (campaign(); as camp) {
        <div class="top-middle-center">
          <app-cc-day-counter
            class="top-middle-day-counter"
            [campaignId]="campaignIdValue"
            [isDm]="isDm()"
            [allowInteraction]="!isDm()"
            [panelTheme]="'dark'"
            [todInput]="camp.timeOfDay ?? null"
            [portalColor]="safeColor(camp.spineColor)"
          />
          <app-cc-world-map
            class="top-middle-world-map"
            [campaignId]="campaignIdValue"
            [worldMapImageUrl]="camp.worldMapImageUrl"
            [isDm]="isDm()"
            [portalColor]="safeColor(camp.spineColor)"
            (imageUploaded)="onWorldMapUploaded($event)"
            (requestView)="openWorldMapDrawer()"
          />
        </div>
      }
    </div>
    <div class="grid-area top-right">
      <cc-grid-area-title
        class="area-title"
        [title]="['The Party']"
        icon="/player_icon.svg"
      />
      @if (campaign(); as camp) {
        <app-cc-party-panel
          [campaignId]="campaignIdValue"
          [portalColor]="safeColor(camp.spineColor)"
        />
      }
    </div>
    
    <!-- ── Middle Row ── -->
    <div class="grid-area middle-left">
      <cc-grid-area-title
        class="area-title"
        [title]="['Factions']"
        icon="/factions.svg"
      />
      <app-cc-card-faction-navigation [campaignId]="campaignIdValue" />
    </div>
    <div class="grid-area middle-middle">
      <cc-grid-area-title
        class="area-title"
        [title]="['The Realm of', campaign()?.name ?? '']"
        icon="/tarot_cards_star.svg"
      />
      @if (showRolodexBlockers()) {
        <div class="rolodex-box-blocker-left">&nbsp;</div>
        <div class="rolodex-box-blocker-right">&nbsp;</div>
      }
      <!-- Hierarchical Card Navigation -->
      <app-cc-card-navigation [campaignId]="campaignIdValue" />
    </div>
    <div class="grid-area middle-right">
      <cc-grid-area-title
        class="area-title"
        [title]="['Soundtracks']"
        icon="/musical_instruments_grey.svg"
      />
      @if (campaign(); as camp) {
        <app-cc-soundtracks
          [campaignId]="campaignIdValue"
          [portalColor]="safeColor(camp.spineColor)"
        />
      }
    </div>
    
    <!-- ── Bottom Row ── -->
    <div class="grid-area bottom-left">
      <cc-grid-area-title
        class="area-title"
        [title]="['More To Come']"
      />
      <app-v2-campaign-placeholder areaName="Bottom Left" />
    </div>
    <div class="grid-area bottom-middle">
      <cc-grid-area-title
        class="area-title"
        [title]="['More To Come']"
      />
      <app-v2-campaign-placeholder areaName="Bottom Middle" />
    </div>
    <div class="grid-area bottom-right">
      <cc-grid-area-title
        class="area-title"
        [title]="['More To Come']"
      />
      <app-v2-campaign-placeholder areaName="Bottom Right" />
    </div>
    
  </div>
  
  <!-- ── Portal breathing border (highest z-index) ── -->
  <div class="portal-breathing-border"></div>
  
</div>

<!-- ── Letterbox bars for safe area ── -->
<div class="void-letterbox-top"></div>
<div class="void-letterbox-bottom"></div>
