@if (isOpen()) {
  <div class="purchase-backdrop" [class.is-closing]="isClosing()" (click)="close()"></div>

  <div class="purchase-drawer" [class.is-closing]="isClosing()" role="dialog" aria-label="Purchase confirmation" [style.--portal-color]="portalColor">
    <div class="purchase-header">
      <button class="purchase-close-btn" (click)="close()" aria-label="Close">✕</button>
      <span class="purchase-header-title">Purchase Item</span>
    </div>

    <div class="purchase-body">
      @if (selectedItem(); as item) {
        <div class="purchase-item-card">
          <h2 class="purchase-item-name">{{ item.name }}</h2>
          <div class="purchase-item-price">{{ item.priceAmount }} {{ item.priceCurrencyType }}</div>
          @if (item.description) {
            <p class="purchase-item-description">{{ item.description }}</p>
          }
        </div>

        <div class="purchase-actions">
          <button class="purchase-buy-btn"
            [class.purchase-buy-btn--loading]="purchasing()"
            [disabled]="purchasing()"
            (click)="buyItem()">
            {{ purchasing() ? '…' : 'Buy' }}
          </button>
        </div>
      }
    </div>
  </div>
}
