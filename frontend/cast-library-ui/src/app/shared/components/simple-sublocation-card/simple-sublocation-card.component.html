<div class="simple-sublocation-card">
  <div class="simple-card-frame">
    <div class="simple-card-inner">
      <!-- banner -->
      <div class="simple-card-banner">
        <div class="simple-card-name">{{ sublocation().name }}</div>
        <div class="simple-card-subtitle">Sublocation · {{ shopItemCount }} item{{ shopItemCount === 1 ? '' : 's' }}</div>
      </div>

      <!-- portrait -->
      <div class="simple-card-portrait">
        @if (sublocation().imageUrl) {
          <img [src]="sublocation().imageUrl" [alt]="'Image of ' + sublocation().name + ' sublocation'" class="simple-card-portrait-img" (error)="$any($event.target).style.display='none'" (load)="$any($event.target).style.display=''" />
        } @else {
          <div class="simple-card-portrait-placeholder">
            <cc-sublocation-icon [width]="22" color="black"></cc-sublocation-icon>
          </div>
        }
      </div>

      <!-- bottom strip -->
      <div class="simple-card-strip">
        <div class="simple-strip-left">
          <div class="simple-pip-row">
            <div class="simple-pip"></div>
            <div class="simple-pip"></div>
            <div class="simple-pip"></div>
          </div>
        </div>
        <span class="simple-strip-label">Sublocation</span>
        <div class="simple-pip-row">
          <div class="simple-pip"></div>
          <div class="simple-pip"></div>
          <div class="simple-pip"></div>
        </div>
      </div>
    </div>
  </div>
</div>
