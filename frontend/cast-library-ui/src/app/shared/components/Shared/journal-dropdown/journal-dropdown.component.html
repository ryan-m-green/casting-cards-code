<ng-container>
  <label [for]="dropdownId" class="fi-label">{{ label }}</label>
  <div class="autocomplete-wrapper" [class.disabled]="disabled" [class.has-swatch]="selectedSwatch">
    <span class="option-swatch field-swatch" *ngIf="selectedSwatch" [style.background]="selectedSwatch"></span>
    <input
      [id]="dropdownId"
      class="fi"
      [formControl]="control"
      placeholder="Pick one"
      autocomplete="off"
      [readonly]="!allowTyping"
      [attr.disabled]="disabled ? '' : null"
      (click)="!disabled && showDropdown()"
      (input)="onInput($event)"
      (blur)="onBlur()" />
    <button class="chevron-button" (click)="!disabled && toggleDropdown($event)" type="button" [disabled]="disabled">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"></polyline>
      </svg>
    </button>
    <div class="autocomplete-dropdown" [class.hidden]="!isDropdownVisible || disabled">
      <div
        *ngFor="let option of filteredOptions"
        class="autocomplete-option"
        (mousedown)="selectOption(option)">
        <span class="option-swatch" *ngIf="swatches[option]" [style.background]="swatches[option]"></span>
        <span class="autocomplete-option-label">{{ option }}</span>
      </div>
      <div *ngIf="filteredOptions.length === 0" class="autocomplete-option no-results">
        No matches
      </div>
    </div>
  </div>
</ng-container>
