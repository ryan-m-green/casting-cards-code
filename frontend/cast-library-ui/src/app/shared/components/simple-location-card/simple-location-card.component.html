<div class="simple-location-card">
  <div class="simple-card-frame">
    <div class="simple-card-inner">
      <!-- banner -->
      <div class="simple-card-banner">
        <div class="simple-card-name">{{ location().name }}</div>
        <div class="simple-card-subtitle">Location · {{ location().classification }}</div>
      </div>

      <!-- portrait -->
      <div class="simple-card-portrait">
        @if (location().imageUrl) {
          <img [src]="location().imageUrl" [alt]="'Image of ' + location().name + ', a ' + location().classification" class="simple-card-portrait-img" (error)="$any($event.target).style.display='none'" (load)="$any($event.target).style.display=''" />
        } @else {
          <div class="simple-card-portrait-placeholder">
            <cc-location-icon [width]="22" color="black"></cc-location-icon>
          </div>
        }
      </div>

      <!-- bottom strip -->
      <div class="simple-card-strip">
        <div class="simple-strip-left">
          <div class="simple-pip-row">
            <div class="simple-pip"></div>
            <div class="simple-pip"></div>
            <div class="simple-pip"></div>
          </div>
        </div>
        <span class="simple-strip-label">Location</span>
        <div class="simple-pip-row">
          <div class="simple-pip"></div>
          <div class="simple-pip"></div>
          <div class="simple-pip"></div>
        </div>
      </div>
    </div>
  </div>
</div>
