<svg class="fate-paper" viewBox="0 0 150 52" preserveAspectRatio="none" aria-hidden="true" focusable="false">
  <defs>
    <filter [attr.id]="roughnessId" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.15" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <filter [attr.id]="shadowId" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.5" dy="1.5" stdDeviation="1.2" flood-color="#2b1d0c" flood-opacity="0.4" />
    </filter>

    <linearGradient [attr.id]="gradientId" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e5c8" />
      <stop offset="35%" stop-color="#e8d4a7" />
      <stop offset="70%" stop-color="#dfc691" />
      <stop offset="100%" stop-color="#ceb073" />
    </linearGradient>
  </defs>

  <g [attr.filter]="shadowFilter">
    <path
      [attr.d]="paperPath"
      [attr.fill]="paperFill"
      stroke="#8a6d3b"
      stroke-width="0.5"
      [attr.filter]="roughnessFilter"
    />
  </g>
</svg>

<span class="fate-body" role="group" [attr.aria-label]="ariaLabel()">
  <button
    #whereRow
    type="button"
    class="fate-where"
    [attr.title]="whereTitle() || null"
    (click)="whereClick.emit()"
  >{{ where() }}</button>

  @if (fates().length) {
    <span class="fate-stamps" [class.fate-stamps--full]="fates().length === 3">
      @for (fate of fates(); track fate) {
        <span
          [class]="'fate-stamp fate-stamp--' + fate"
          [style.transform]="'rotate(' + tiltFor(fate) + 'deg)'"
          [attr.title]="label(fate)"
          role="img"
          [attr.aria-label]="label(fate)"
        >
          @switch (fate) {
            @case ('defeated') {
              <img class="fate-icon" src="/encounter_death.svg" alt="" aria-hidden="true" draggable="false" />
            }
            @case ('captured') {
              <img class="fate-icon" src="/caged_goblin_captivity.svg" alt="" aria-hidden="true" draggable="false" />
            }
            @case ('fled') {
              <img class="fate-icon" src="/running_goblin.svg" alt="" aria-hidden="true" draggable="false" />
            }
          }
        </span>
      }
    </span>
  }

  <span class="fate-note-row">
    <svg
      class="fate-tick"
      [class.fate-tick--on]="hasNote()"
      viewBox="0 -1 24 21"
      role="img"
      [attr.aria-label]="hasNote() ? 'A note is written' : 'No note yet'"
      focusable="false"
    >
      <rect class="fate-tick__box" x="3" y="3" width="13" height="13" rx="2.6" />
      <path class="fate-tick__mark" d="M5.2 6.8 Q6.7 10.1 9.5 11.7 Q15 5 21.9 0.5" />
    </svg>

    <button
      type="button"
      class="fate-note"
      [attr.title]="noteTitle() || null"
      (click)="openNote.emit()"
    >{{ noteLabel() }}</button>
  </span>
</span>
